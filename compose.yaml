services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: renal
      POSTGRES_USER: renal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renal"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://renal:${POSTGRES_PASSWORD}@db:5432/renal
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD}
      COOKIE_SECURE: "false"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
